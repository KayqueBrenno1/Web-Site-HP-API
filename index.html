<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./css/reset.css">
    <link rel="stylesheet" href="./css/style.css">
    <script src="./main.js" defer></script>
    <title>WizardDex</title>
</head>

<body>
    <header>
        <h1>WizardDex</h1>
    </header>
    <div class="bg-wrapper">
        <main>
            <div class="hero-content">
                <h1>Arquivo Mágico de Hogwarts</h1>

                <p class="description">
                    Consulte os registros do Ministério da Magia. Descubra bruxos, professores e criaturas.
                </p>

                <div class="search-container">
                    <div class="search-box">
                        <input type="text" id="search-input" class="search-input"
                            placeholder="Pesquise um bruxo, professora, criatura ou casa..." autocomplete="off" />
                        <button class="btn-search" id="btn-search">Buscar</button>
                    </div>
                    <div class="autocomplete-dropdown" id="autocomplete-dropdown"></div>
                </div>

                <div class="container-btn-random">
                    <button class="btn-random" id="btn-random">Bruxo Aleatório</button>
                </div>
            </div>
        </main>
        <footer>
            <div class="dados">
                <p>Dados fornecidos por: <a href="https://hp-api.onrender.com/">HP-API</a></p>

            </div>
        </footer>
    </div>
</body>

</html>
